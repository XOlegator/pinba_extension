name: Bug Report
description: Report a reproducible defect in the extension, build flow, CI, or packaging.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible bugs in the extension or its development workflows.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect and its impact.
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP Version
      description: "Example: 8.4.22"
      placeholder: 8.4.22
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, Ubuntu release, architecture, and SAPI if relevant.
      placeholder: Ubuntu 24.04, x86_64, php-fpm
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Release tag, commit, or branch.
      placeholder: v1.1.2 or 5929197
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Provide exact commands or PHP code when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Logs, traces, CI links, or related Pinba Engine observations.
