name: Feature Request
description: Propose a new capability or modernization improvement for the fork.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for feature proposals that preserve or intentionally evolve the fork.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What limitation or pain point are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Change
      description: Describe the desired behavior or workflow.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility Impact
      description: Note any effect on PHP API, protobuf payload, Pinba Engine, packaging, or CI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: List rejected options if you evaluated any.
