name: package

# Builds the Debian source package and the per-version php<X.Y>-pinba binary
# packages on Ubuntu, then runs lintian. This proves the debian/ packaging
# stays buildable across the whole supported PHP matrix. Launchpad signing and
# upload are intentionally out of scope here (they need GPG secrets and a
# per-suite upload flow) and are handled separately.

on:
  push:
    branches:
      - master
    paths:
      - 'debian/**'
      - 'config.m4'
      - '**.c'
      - '**.h'
      - 'pinba.proto'
      - '.github/workflows/package.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'debian/**'
      - 'config.m4'
      - '**.c'
      - '**.h'
      - 'pinba.proto'
      - '.github/workflows/package.yml'
  workflow_dispatch:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deb:
    name: Build Debian packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add ondrej/php PPA and install build tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            fakeroot \
            lintian \
            pkgconf \
            libprotobuf-c-dev \
            php8.2-dev \
            php8.3-dev \
            php8.4-dev \
            php8.5-dev

      - name: Build orig tarball
        run: |
          upstream="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          echo "Upstream version: $upstream"
          git archive --prefix="php-pinba-${upstream}/" HEAD \
            | gzip -9 > "../php-pinba_${upstream}.orig.tar.gz"

      - name: Build binary packages
        run: dpkg-buildpackage -b -us -uc

      - name: Run lintian
        run: lintian --fail-on error ../php-pinba_*_amd64.changes

      - name: Collect packages
        run: |
          mkdir -p dist
          mv ../php8.*-pinba_*.deb dist/
          mv ../php8.*-pinba-dbgsym_*.ddeb dist/ 2>/dev/null || true

      - name: Show package contents
        run: |
          for deb in dist/php8.*-pinba_*.deb; do
            echo "=== $deb ==="
            dpkg -c "$deb" | grep -E 'pinba\.(so|ini)'
            dpkg -I "$deb" | grep -E 'Package:|Depends:'
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
