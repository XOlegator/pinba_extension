name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # clang-format is the local clang-format hook; shellcheck lets the
      # actionlint hook validate embedded run-step scripts.
      - name: Install hook system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang-format shellcheck

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: |
          python -m pip install --upgrade pre-commit
          pre-commit run --all-files --show-diff-on-failure

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: phpize

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang-tidy libprotobuf-c-dev pkgconf

      - name: Configure (generates config.h)
        run: |
          phpize
          ./configure --enable-pinba

      - name: Run clang-tidy
        run: tools/run-clang-tidy.sh
