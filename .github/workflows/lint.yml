name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          shellcheck: true

      - name: Shellcheck standalone scripts
        run: shellcheck tools/*.sh

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            README.md
            docs/**/*.md

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check C formatting
        # Hand-written, git-tracked C only. The protobuf-c bindings
        # (pinba-pb-c.c / pinba.pb-c.h) are generated by protoc-c and are
        # guarded by proto-drift.yml, so they must not be reformatted here.
        run: |
          git ls-files '*.c' '*.h' \
            | grep -vE '(^|/)(pinba-pb-c\.c|pinba\.pb-c\.h)$' \
            | xargs clang-format --dry-run --Werror
