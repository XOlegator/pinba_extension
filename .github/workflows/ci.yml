name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Resolve support matrix
    runs-on: ubuntu-latest
    outputs:
      php-versions: ${{ steps.read-matrix.outputs.php-versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read PHP support matrix
        id: read-matrix
        run: echo "php-versions=$(jq -c '.targets.php' .github/php-versions.json)" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: matrix
    name: Build and test / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJson(needs.matrix.outputs.php-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: phpize

      - name: Show toolchain
        run: |
          php -v
          phpize -v
          php-config --version

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libprotobuf-c-dev

      - name: Prepare build
        run: phpize

      - name: Configure
        run: ./configure --enable-pinba

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make test NO_INTERACTION=1 REPORT_EXIT_STATUS=1
        env:
          TEST_PHP_JUNIT: ${{ github.workspace }}/tests/junit.xml

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: tests/junit.xml
          check_name: PHPT report (PHP ${{ matrix.php-version }})
          require_tests: true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-php${{ matrix.php-version }}
          path: |
            tests/junit.xml
            tests/*.diff
            tests/*.exp
            tests/*.log
            tests/*.out
            tests/*.php
            tests/*.sh
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: Coverage (C, gcov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: phpize

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libprotobuf-c-dev gcovr

      - name: Build instrumented extension and run tests
        run: bash tools/run-tests.sh coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: phpt
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    # PHP itself is built with ASan/UBSan so the instrumented extension is not
    # loaded into a stock PHP (which uses RTLD_DEEPBIND and breaks ASan). This
    # makes the run a real, gating memory-safety check.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libprotobuf-c-dev pkg-config

      - name: Cache ASan PHP build
        id: cache-php-asan
        uses: actions/cache@v5
        with:
          path: ~/php-asan
          key: php-asan-${{ runner.os }}-PHP-8.4-${{ hashFiles('tools/build-php-asan.sh') }}

      - name: Build ASan PHP
        if: steps.cache-php-asan.outputs.cache-hit != 'true'
        run: bash tools/build-php-asan.sh 8.4

      - name: Put ASan PHP on PATH
        run: echo "$HOME/php-asan/bin" >> "$GITHUB_PATH"

      - name: Relax ASLR entropy for ASan
        # Ubuntu 24.04 runners default to vm.mmap_rnd_bits=32, which the gcc 13
        # ASan runtime cannot map shadow memory against (it aborts at startup).
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build extension and run tests under ASan/UBSan
        env:
          PHP_ASAN: '1'
        run: bash tools/run-tests.sh asan

      - name: Upload sanitizer test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-artifacts
          path: |
            tests/*.out
            tests/*.log
            tests/*.diff
          if-no-files-found: ignore
          retention-days: 14

  valgrind:
    name: Valgrind memcheck (informational)
    runs-on: ubuntu-latest
    # PHP itself produces benign noise under Valgrind, so this job reports
    # findings without blocking the build until a suppression file is curated.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: phpize

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libprotobuf-c-dev valgrind

      - name: Build and run tests under Valgrind
        run: bash tools/run-tests.sh valgrind
